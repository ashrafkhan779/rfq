  /* =========================== 6. CUSTOMER PERFORMANCE =========================== */
  renderPerf(rows){
    const el = document.getElementById('page-perf');
    const byCu = groupBy(rows, r=>r.customer);
    const segOf = d => d === null ? ['No order yet','none'] : d <= 90 ? ['Active','active'] : d <= 180 ? ['Cooling','cooling'] : d <= 365 ? ['At risk','risk'] : ['Dormant','dormant'];
    const matrix = Object.keys(byCu).map(c => {
      const g = byCu[c], pos = g.filter(r=>r.status==='PO Received');
      const dates = g.flatMap(r=>[r.rfq,r.po,r.qtn]).filter(Boolean).sort();
      const first = g.map(r=>r.rfq).filter(Boolean).sort()[0], lastAct = dates[dates.length-1];
      const lastOrder = pos.map(r=>r.po||r.rfq).filter(Boolean).sort().pop() || null;
      const since = lastOrder ? daysSince(lastOrder) : null;
      const months = first && lastAct ? Math.max(1, Math.round(daysBetween(first,lastAct)/30.44)) : null;
      const [segL, segC] = segOf(since);
      return { customer:c, country: uniq(g.map(r=>r.country)).join(', '), rfqs:g.length, quoted:sum(g,val), pos:pos.length, ltv:sum(pos,val), avgPO: pos.length? sum(pos,val)/pos.length : null, win: winRate(g), first, lastRfq: g.map(r=>r.rfq).filter(Boolean).sort().pop(), lastOrder, since, months, open: g.filter(r=>r.status==='Open Quote'||r.status==='Under Pipeline').length, openVal: sum(g.filter(r=>r.status==='Open Quote'||r.status==='Under Pipeline'),val), segL, segC, d2po: (() => { const d = pos.map(r=>r.daysToPO).filter(x=>x!==null); return d.length? Math.round(mean(d)) : null; })() };
    });
    const segs = ['Active','Cooling','At risk','Dormant','No order yet']; const segCls = {Active:'active',Cooling:'cooling','At risk':'risk',Dormant:'dormant','No order yet':'none'}; const segColor = {Active:'var(--st-po)',Cooling:'var(--st-open)','At risk':'var(--st-pipe)',Dormant:'var(--st-lost)','No order yet':'var(--st-dec)'};
    const bySeg = groupBy(matrix, m=>m.segL);
    const ltvTotal = sum(matrix, m=>m.ltv), maxLtv = Math.max(...matrix.map(m=>m.ltv), 1);
    const sortedLtv = [...matrix].sort((a,b)=>b.ltv-a.ltv); let cum = 0; const paretoN = sortedLtv.findIndex(m => { cum += m.ltv; return cum >= ltvTotal*0.8; }) + 1;
    el.innerHTML = `
      ${this.tilesHTML([
        { lbl:'Customers', val: fmtInt(matrix.length), hint:`${matrix.filter(m=>m.pos).length} have ordered` },
        { lbl:'Lifetime PO value', val: eur(ltvTotal), hint:`avg ${eur(matrix.filter(m=>m.pos).length ? ltvTotal/matrix.filter(m=>m.pos).length : 0)} per buying customer` },
        { lbl:'Active (ordered ≤ 90 d)', val: fmtInt((bySeg['Active']||[]).length), cls:'ok', hint: eur(sum(bySeg['Active']||[], m=>m.ltv)) + ' LTV' },
        { lbl:'At risk / dormant', val: fmtInt((bySeg['At risk']||[]).length + (bySeg['Dormant']||[]).length), cls:((bySeg['At risk']||[]).length+(bySeg['Dormant']||[]).length)?'warn':'', hint: eur(sum([...(bySeg['At risk']||[]),...(bySeg['Dormant']||[])], m=>m.ltv)) + ' LTV cooling off' },
        { lbl:'Never ordered', val: fmtInt((bySeg['No order yet']||[]).length), hint: eur(sum(bySeg['No order yet']||[], m=>m.openVal)) + ' open with them' },
        { lbl:'80% of LTV from', val: ltvTotal ? `${paretoN} customer${paretoN===1?'':'s'}` : '—', hint:'Pareto concentration' },
      ])}
      <div class="grid g3">
        ${this.card('pf-seg','Recency segments','Customers by days since last order · LTV inside')}
        ${this.card('pf-ltv','Lifetime value leaders','Top 10 by PO value received','span2')}
      </div>
      <div class="grid g2">
        ${this.card('pf-since','Days since last order','Buying customers, longest gap first — the re-engagement list')}
        ${this.card('pf-win','Win rate by customer','Decided bids only (≥ 2 decisions) · bubble label shows decisions')}
      </div>
      <div class="card"><div class="card-head"><div><h3>Customer performance matrix</h3><p class="sub">Last order = most recent PO received · Days since = today − last order · Months = active relationship span (first RFQ → latest activity) · Lifetime value = PO received value (EUR) · click a customer name to open it</p></div></div><div id="perfTable"></div></div>`;
    Chart.donut(document.getElementById('pf-seg'), segs.map(s=>({label:s, value:(bySeg[s]||[]).length, color:segColor[s]})), { centerLabel:'customers', fmt:v=>v+' cust.' });
    Chart.hbar(document.getElementById('pf-ltv'), sortedLtv.slice(0,10).filter(m=>m.ltv>0).map(m=>({label:m.customer, value:m.ltv, color:'var(--st-po)', tip:`${m.pos} POs · last ${fmtDate(m.lastOrder)}`})), { fmt:eur, labelW:150, onClick:k=>this.setFilter('customer',k) });
    Chart.hbar(document.getElementById('pf-since'), matrix.filter(m=>m.since!==null).sort((a,b)=>b.since-a.since).slice(0,12).map(m=>({label:m.customer, value:m.since, color: segColor[m.segL], tip:`LTV ${eur(m.ltv)} · ${m.pos} POs`})), { fmt:v=>v+' d', labelW:150, onClick:k=>this.setFilter('customer',k) });
    Chart.hbar(document.getElementById('pf-win'), matrix.filter(m=>m.win!==null && (m.pos + byCu[m.customer].filter(r=>r.status==='Bid Lost').length) >= 2).sort((a,b)=>b.win-a.win).slice(0,12).map(m=>({label:m.customer, value:m.win, color: m.win>=0.6?'var(--st-po)':m.win>=0.4?'var(--st-pipe)':'var(--st-lost)', tip:`${m.pos} won · ${byCu[m.customer].filter(r=>r.status==='Bid Lost').length} lost`})), { fmt:v=>fmtPct(v), labelW:150, onClick:k=>this.setFilter('customer',k) });
    const cols = [
      { id:'customer', label:'Customer', key:'customer', render: m => `<a href="#" data-cust="${esc(m.customer)}" style="color:var(--text);font-weight:700;text-decoration:none">${esc(m.customer)}</a>` },
      { id:'country', label:'Country', key:'country' },
      { id:'seg', label:'Segment', key:'segL', render: m => `<span class="seg ${m.segC}">${m.segL}</span>` },
      { id:'lastOrder', label:'Last order', key:'lastOrder', render: m => fmtDate(m.lastOrder) },
      { id:'since', label:'Days since', key:'since', num:true, render: m => m.since===null?'—':`<b>${m.since}</b>` },
      { id:'months', label:'Months active', key:'months', num:true },
      { id:'ltv', label:'Lifetime value (EUR)', key:'ltv', num:true, render: m => `<div class="bar-cell" style="justify-content:flex-end"><i style="width:${Math.max(2,m.ltv/maxLtv*70)}px;opacity:${m.ltv?1:.15}"></i><span>${eurFull(m.ltv)}</span></div>` },
      { id:'pos', label:'POs', key:'pos', num:true },
      { id:'avgPO', label:'Avg PO', key:'avgPO', num:true, render: m => eur(m.avgPO) },
      { id:'rfqs', label:'RFQ count', key:'rfqs', num:true },
      { id:'quoted', label:'Quoted (EUR)', key:'quoted', num:true, render: m => eur(m.quoted) },
      { id:'win', label:'Win rate', key:'win', num:true, render: m => fmtPct(m.win) },
      { id:'open', label:'Open / pipeline', key:'open', num:true, render: m => m.open ? `${m.open} <span style="color:var(--muted)">(${eur(m.openVal)})</span>` : '—', csv: m => m.open },
      { id:'d2po', label:'Avg days to PO', key:'d2po', num:true },
      { id:'first', label:'First RFQ', key:'first', render: m => fmtDate(m.first) },
      { id:'lastRfq', label:'Latest RFQ', key:'lastRfq', render: m => fmtDate(m.lastRfq) },
    ];
    renderTable(document.getElementById('perfTable'), 'perf', matrix, cols, { sortKey:'ltv', sortDir:'desc', rowId: m => m.customer, cls:'matrix', pageSize: 100, csvName:'customer_performance' });
    document.getElementById('perfTable').addEventListener('click', e => { const a = e.target.closest('[data-cust]'); if (a) { e.preventDefault(); this.f.customer = a.dataset.cust; this.go('customer'); } });
  }

  /* =========================== 7. DATA & UPLOAD =========================== */
  loadPayload(payload, origin){
    this.meta = payload.meta; this.rows = payload.rows; this.origin = origin || this.origin;
    FILTERS.forEach(x => this.f[x.id] = ''); this.search = ''; document.getElementById('f-search').value = '';
    Object.keys(TableState).forEach(k => delete TableState[k]);
    this.footer(); this.render();
  }
  footer(){ const m = this.meta; document.getElementById('sideFoot').innerHTML = `<b>${esc(m.source)}</b> · ${esc(m.sheet)}<br>${fmtDate(m.dateRange[0])} → ${fmtDate(m.dateRange[1])}<br>${m.rowCount} RFQ lines · values in ${m.currency}<br>Rebuilt ${esc(m.generated)}`; }
  renderData(){
    const el = document.getElementById('page-data'); const m = this.meta;
    const st = this.statusStats(this.rows);
    const unknown = uniq(this.rows.map(r=>r.status)).filter(x => !STATUS.includes(x));
    el.innerHTML = `
      <div class="grid g2">
        <div class="card"><div class="card-head"><div><h3>Upload a new HP.xlsx</h3><p class="sub">The workbook is read in your browser — nothing is sent anywhere. Every figure, chart, table and remark updates immediately.</p></div></div>
          <label class="drop" id="drop"><input type="file" id="xlsxInput" accept=".xlsx,.xlsm,.xls"><h4>Drop the Excel file here or click to choose</h4><p>Sheet “MAIN TABLE” (or the first sheet) with the same headers as the original tracker</p></label>
          <div class="log" id="uploadLog" style="margin-top:var(--s3)">${this.uploadLog || '<span style="color:var(--muted)">No upload yet this session.</span>'}</div>
        </div>
        <div class="card"><div class="card-head"><div><h3>Current dataset</h3><p class="sub">Loaded from ${esc(this.origin || 'embedded data')}</p></div></div>
          <div class="kv"><b>Source file</b><span>${esc(m.source)}</span><b>Sheet</b><span>${esc(m.sheet)}</span><b>Generated</b><span>${esc(m.generated)}</span><b>RFQ lines</b><span>${m.rowCount}</span><b>Date range</b><span>${fmtDate(m.dateRange[0])} → ${fmtDate(m.dateRange[1])}</span><b>Customers / countries</b><span>${m.customers.length} / ${m.countries.length}</span><b>Statuses</b><span>${st.map(x=>`${esc(x.status)} <b style="color:var(--text)">${x.count}</b>`).join(' · ')}</span>${unknown.length?`<b style="color:var(--neg)">Unrecognised statuses</b><span style="color:var(--neg)">${esc(unknown.join(', '))} — these rows are counted in totals but not in the status KPIs</span>`:''}</div>
          <div style="display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)">
            <button class="btn primary" id="dlJson"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Download data.json</button>
            <button class="btn" id="dlCsv"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Download clean CSV</button>
          </div>
        </div>
      </div>
      <div class="card"><div class="card-head"><div><h3>Publish the updated dashboard on GitHub</h3><p class="sub">When this page is served from GitHub Pages it loads <code>data.json</code> from the repository first (with a cache-busting timestamp), so replacing that one file updates the live dashboard for everyone.</p></div></div>
        <ol class="steps">
          <li><span>Upload the new <code>HP.xlsx</code> above and check the log shows the expected row and status counts.</span></li>
          <li><span>Click <b>Download data.json</b>.</span></li>
          <li><span>In your GitHub repository open <code>data.json</code> → <b>Edit</b> (or drag-and-drop the file over the repo) and commit. Keep the file name exactly <code>data.json</code>, next to <code>index.html</code>.</span></li>
          <li><span>GitHub Pages redeploys in about a minute. Reload the live URL — the sidebar footer shows the new “Rebuilt” timestamp.</span></li>
          <li><span>Opening <code>index.html</code> directly from your computer (file://) still uses the data embedded by <code>convert.py</code>; run <code>python convert.py</code> when you also want the offline copy refreshed.</span></li>
        </ol></div>`;
    const drop = document.getElementById('drop'), input = document.getElementById('xlsxInput');
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) this.ingest(f); });
    input.addEventListener('change', e => { const f = e.target.files[0]; if (f) this.ingest(f); });
    document.getElementById('dlJson').addEventListener('click', () => download('data.json', JSON.stringify({ meta: this.meta, rows: this.rows }, null, 1), 'application/json'));
    document.getElementById('dlCsv').addEventListener('click', () => download('hp_rfq_clean.csv', toCSV(this.rows, Object.keys(this.rows[0]||{}).map(k => ({ label:k, key:k })))));
  }
  async ingest(file){
    const log = [];
    const L = (cls, t) => { log.push(`<span class="${cls}">${t}</span>`); this.uploadLog = log.join('<br>'); const n = document.getElementById('uploadLog'); if (n) n.innerHTML = this.uploadLog; };
    try {
      if (typeof XLSX === 'undefined') throw new Error('Excel parser not available in this build.');
      L('', `Reading <b>${esc(file.name)}</b> (${Math.round(file.size/1024)} KB)…`);
      const buf = await file.arrayBuffer();
      const res = parseWorkbook(buf, file.name);
      res.log.forEach(x => L(x[0], x[1]));
      if (!res.payload.rows.length) throw new Error('No RFQ rows found — check the sheet name and headers.');
      L('ok', `✓ Dashboard updated with ${res.payload.rows.length} RFQ lines. Download data.json to publish.`);
      this.loadPayload(res.payload, `upload: ${file.name}`);
    } catch (err) { L('bad', '✕ ' + esc(err.message)); }
  }
}

/* =====================================================================
   0. BOOT — load embedded data (file://) or fetch data.json (http://)
   ===================================================================== */
(async function boot(){
  let payload = null, origin = 'embedded data';
  const embedded = document.getElementById('hp-data').textContent.trim();
  // On a web server (e.g. GitHub Pages) data.json in the repo is the source of truth; cache-busting keeps mobile/CDN fresh.
  if (/^https?:$/.test(location.protocol)) {
    try { const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' }); if (r.ok) { payload = await r.json(); origin = 'data.json (repository)'; } } catch(e){ /* fall through to embedded */ }
  }
  if (!payload && embedded) { try { payload = JSON.parse(embedded); } catch(e){ console.error('Embedded data invalid', e); } }
  if (!payload) {
    try { payload = await (await fetch('data.json')).json(); origin = 'data.json'; }
    catch(e){
      document.querySelector('.content').innerHTML = '<div class="card empty"><b>No data loaded</b>Run <code>python convert.py</code> next to HP.xlsx to embed the dataset into this file.</div>';
      return;
    }
  }
  window.APP = new App(payload, origin);
})();
</script>
