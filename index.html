        ${this.card('op-cust','Biggest open opportunities','Top customers by open quoted value')}
      </div>
      <div class="card"><div class="card-head"><div><h3>Open RFQ register</h3><p class="sub">Sorted by closing date · overdue lines first · click a row for bid feedback</p></div></div><div id="openTable"></div></div>`;
    const byS = groupBy(open, r=>r.stage||'—'); Chart.hbar(document.getElementById('op-stage'), Object.keys(byS).map(k=>({label:k,value:byS[k].length,color:'var(--st-open)',tip:eur(sum(byS[k],val))})).sort((a,b)=>b.value-a.value), { fmt:v=>v, labelW:170 });
    const ab = [['0–7 d',0,7],['8–14 d',8,14],['15–30 d',15,30],['31–60 d',31,60],['61–90 d',61,90],['90+ d',91,1e9]];
    Chart.hbar(document.getElementById('op-age'), ab.map(([l,a,b])=>({label:l, value: open.filter(r=>{const d=daysSince(r.rfq); return d!==null&&d>=a&&d<=b;}).length, color: a>60?'var(--st-lost)':a>30?'var(--st-pipe)':'var(--st-open)'})), { fmt:v=>v, labelW:70 });
    const byC = groupBy(open, r=>r.country); Chart.hbar(document.getElementById('op-country'), Object.keys(byC).map(k=>({label:k,value:sum(byC[k],val),color:'var(--st-open)',tip:byC[k].length+' RFQs'})).sort((a,b)=>b.value-a.value), { fmt:eur, labelW:60, onClick:k=>this.setFilter('country',k) });
    const wk = groupBy(open.filter(r=>r.close), r => { const d = pd(r.close); const m = new Date(d); m.setDate(d.getDate() - ((d.getDay()+6)%7)); return m.toISOString().slice(0,10); });
    Chart.combo(document.getElementById('op-due'), Object.keys(wk).sort().map(k=>{ const d=pd(k); const over = pd(k) < TODAY; return { key:k, label:`${d.getDate()} ${MONTHS[d.getMonth()]}`, values:[ over?wk[k].length:0, over?0:wk[k].length ], line: sum(wk[k],val) }; }), { series:[{name:'Closing date passed',color:'var(--st-lost)'},{name:'Closing ahead',color:'var(--st-open)'}], line:{name:'Quoted value'}, fmtLine:eur, height:220 });
    const byCu = groupBy(open, r=>r.customer); Chart.hbar(document.getElementById('op-cust'), Object.keys(byCu).map(k=>({label:k,value:sum(byCu[k],val),color:'var(--st-open)',tip:byCu[k].length+' RFQs'})).sort((a,b)=>b.value-a.value).slice(0,8), { fmt:eur, labelW:140, onClick:k=>this.setFilter('customer',k) });
    renderTable(document.getElementById('openTable'), 'open', open, rfqColumns({ exclude:['status','po','d2po'] }), { sortKey:'close', sortDir:'asc', detail: rfqDetail, csvName:'open_rfqs' });
  }

  /* =========================== 5. UNDER PIPELINE =========================== */
  renderPipeline(rows){
    const el = document.getElementById('page-pipeline');
    const pipe = rows.filter(r => r.status === 'Under Pipeline');
    const awaiting = pipe.filter(r => /awaiting po/i.test(r.stage)), clar = pipe.filter(r => /clarif/i.test(r.stage)), supp = pipe.filter(r => /supplier|internal/i.test(r.stage));
    const ages = pipe.map(r => daysSince(r.qtn || r.rfq)).filter(x=>x!==null);
    el.innerHTML = `
      ${this.tilesHTML([
        { lbl:'Under pipeline', val: fmtInt(pipe.length), hint:`${fmtPct(pipe.length/Math.max(rows.length,1))} of filtered intake` },
        { lbl:'Pipeline value', val: eur(sum(pipe,val)), hint: eurFull(sum(pipe,val)) },
        { lbl:'Awaiting PO', val: eur(sum(awaiting,val)), cls:'ok', hint:`${awaiting.length} quotes — nearest to conversion` },
        { lbl:'Clarification stage', val: fmtInt(clar.length), hint: eur(sum(clar,val)) },
        { lbl:'With supplier / internal', val: fmtInt(supp.length), hint: eur(sum(supp,val)) },
        { lbl:'Median days since quote', val: ages.length ? median(ages)+' d' : '—', hint:`oldest ${ages.length?Math.max(...ages):'—'} d` },
      ])}
      <div class="grid g3">
        ${this.card('pp-stage','Pipeline by stage','Value per stage — a funnel toward PO')}
        ${this.card('pp-age','Aging since quotation','Long waits at “Awaiting PO” signal follow-up needed')}
        ${this.card('pp-country','By country','Pipeline value, click to drill')}
      </div>
      <div class="grid g2">
        ${this.card('pp-cust','Pipeline by customer','Top customers by pipeline value · click to drill')}
        ${this.card('pp-monthly','Pipeline by RFQ month','When the pipeline RFQs were received')}
      </div>
      <div class="card"><div class="card-head"><div><h3>Pipeline register</h3><p class="sub">Sorted by value · includes clarification dates in the row details</p></div></div><div id="pipeTable"></div></div>`;
    const stageOrder = ['Floated To Supplier/Internal','Quote Received Supplier/Internal','Quoted To Client','Clarification Complete','Awaiting PO'];
    const byS = groupBy(pipe, r=>r.stage||'—'); const keys = [...stageOrder.filter(s=>byS[s]), ...Object.keys(byS).filter(s=>!stageOrder.includes(s))];
    Chart.hbar(document.getElementById('pp-stage'), keys.map(k=>({label:k, value:sum(byS[k],val), color: /awaiting/i.test(k)?'var(--st-po)':'var(--st-pipe)', tip: byS[k].length+' RFQs'})), { fmt:eur, labelW:180 });
    const ab = [['0–14 d',0,14],['15–30 d',15,30],['31–60 d',31,60],['61–90 d',61,90],['91–180 d',91,180],['180+ d',181,1e9]];
    Chart.hbar(document.getElementById('pp-age'), ab.map(([l,a,b])=>({label:l, value: pipe.filter(r=>{const d=daysSince(r.qtn||r.rfq); return d!==null&&d>=a&&d<=b;}).length, color: a>90?'var(--st-lost)':a>30?'var(--st-pipe)':'var(--st-po)'})), { fmt:v=>v, labelW:80 });
    const byC = groupBy(pipe, r=>r.country); Chart.hbar(document.getElementById('pp-country'), Object.keys(byC).map(k=>({label:k,value:sum(byC[k],val),color:'var(--st-pipe)',tip:byC[k].length+' RFQs'})).sort((a,b)=>b.value-a.value), { fmt:eur, labelW:60, onClick:k=>this.setFilter('country',k) });
    const byCu = groupBy(pipe, r=>r.customer); Chart.hbar(document.getElementById('pp-cust'), Object.keys(byCu).map(k=>({label:k, values:[sum(byCu[k].filter(r=>/awaiting/i.test(r.stage)),val), sum(byCu[k].filter(r=>!/awaiting/i.test(r.stage)),val)]})).sort((a,b)=>sum(b.values)-sum(a.values)).slice(0,10), { series:[{name:'Awaiting PO',color:'var(--st-po)'},{name:'Earlier stage',color:'var(--st-pipe)'}], fmt:eur, labelW:150, onClick:k=>this.setFilter('customer',k) });
    Chart.combo(document.getElementById('pp-monthly'), this.monthly(pipe).map(m=>({key:m.key,label:m.label,values:[m.rows.length],line:sum(m.rows,val)})), { series:[{name:'RFQs',color:'var(--st-pipe)'}], line:{name:'Pipeline value'}, fmtLine:eur, height:220, onClick:k=>this.setFilter('month',k) });
    const cols = rfqColumns({ exclude:['status','po','d2po'] }).concat([
      { id:'qtn', label:'Quoted on', key:'qtn', render:r=>fmtDate(r.qtn) },
      { id:'wait', label:'Days since quote', key: r => daysSince(r.qtn||r.rfq), num:true, render: r => { const d = daysSince(r.qtn||r.rfq); return d===null?'—':`<span class="due ${d>90?'over':d>30?'soon':'ok'}">${d}d</span>`; } },
      { id:'clar', label:'Clarification', key: r => r.clarRecv, render: r => r.clarRecv ? `${fmtDate(r.clarRecv)} → ${r.clarDone?fmtDate(r.clarDone):'<span class="due soon">open</span>'}` : '—', csv: r => r.clarRecv ? `${r.clarRecv} -> ${r.clarDone||'open'}` : '' },
    ]);
    renderTable(document.getElementById('pipeTable'), 'pipeline', pipe, cols, { sortKey:'value', sortDir:'desc', detail: rfqDetail, csvName:'under_pipeline' });
  }

  /* =========================== 6. CUSTOMER PERFORMANCE =========================== */
  renderPerf(rows){
    const el = document.getElementById('page-perf');
    const byCu = groupBy(rows, r=>r.customer);
    const segOf = d => d === null ? ['No order yet','none'] : d <= 90 ? ['Active','active'] : d <= 180 ? ['Cooling','cooling'] : d <= 365 ? ['At risk','risk'] : ['Dormant','dormant'];
    const matrix = Object.keys(byCu).map(c => {
      const g = byCu[c], pos = g.filter(r=>r.status==='PO Received');
      const dates = g.flatMap(r=>[r.rfq,r.po,r.qtn]).filter(Boolean).sort();
      const first = g.map(r=>r.rfq).filter(Boolean).sort()[0], lastAct = dates[dates.length-1];
      const lastOrder = pos.map(r=>r.po||r.rfq).filter(Boolean).sort().pop() || null;
      const since = lastOrder ? daysSince(lastOrder) : null;
      const months = first && lastAct ? Math.max(1, Math.round(daysBetween(first,lastAct)/30.44)) : null;
      const [segL, segC] = segOf(since);
      return { customer:c, country: uniq(g.map(r=>r.country)).join(', '), rfqs:g.length, quoted:sum(g,val), pos:pos.length, ltv:sum(pos,val), avgPO: pos.length? sum(pos,val)/pos.length : null, win: winRate(g), first, lastRfq: g.map(r=>r.rfq).filter(Boolean).sort().pop(), lastOrder, since, months, open: g.filter(r=>r.status==="Open RFQ's"||r.status==='Under Pipeline').length, openVal: sum(g.filter(r=>r.status==="Open RFQ's"||r.status==='Under Pipeline'),val), segL, segC, d2po: (() => { const d = pos.map(r=>r.daysToPO).filter(x=>x!==null); return d.length? Math.round(mean(d)) : null; })() };
    });
    const segs = ['Active','Cooling','At risk','Dormant','No order yet']; const segCls = {Active:'active',Cooling:'cooling','At risk':'risk',Dormant:'dormant','No order yet':'none'}; const segColor = {Active:'var(--st-po)',Cooling:'var(--st-open)','At risk':'var(--st-pipe)',Dormant:'var(--st-lost)','No order yet':'var(--st-dec)'};
    const bySeg = groupBy(matrix, m=>m.segL);
    const ltvTotal = sum(matrix, m=>m.ltv), maxLtv = Math.max(...matrix.map(m=>m.ltv), 1);
    const sortedLtv = [...matrix].sort((a,b)=>b.ltv-a.ltv); let cum = 0; const paretoN = sortedLtv.findIndex(m => { cum += m.ltv; return cum >= ltvTotal*0.8; }) + 1;
    el.innerHTML = `
      ${this.tilesHTML([
        { lbl:'Customers', val: fmtInt(matrix.length), hint:`${matrix.filter(m=>m.pos).length} have ordered` },
        { lbl:'Lifetime PO value', val: eur(ltvTotal), hint:`avg ${eur(matrix.filter(m=>m.pos).length ? ltvTotal/matrix.filter(m=>m.pos).length : 0)} per buying customer` },
        { lbl:'Active (ordered ≤ 90 d)', val: fmtInt((bySeg['Active']||[]).length), cls:'ok', hint: eur(sum(bySeg['Active']||[], m=>m.ltv)) + ' LTV' },
        { lbl:'At risk / dormant', val: fmtInt((bySeg['At risk']||[]).length + (bySeg['Dormant']||[]).length), cls:((bySeg['At risk']||[]).length+(bySeg['Dormant']||[]).length)?'warn':'', hint: eur(sum([...(bySeg['At risk']||[]),...(bySeg['Dormant']||[])], m=>m.ltv)) + ' LTV cooling off' },
        { lbl:'Never ordered', val: fmtInt((bySeg['No order yet']||[]).length), hint: eur(sum(bySeg['No order yet']||[], m=>m.openVal)) + ' open with them' },
        { lbl:'80% of LTV from', val: ltvTotal ? `${paretoN} customer${paretoN===1?'':'s'}` : '—', hint:'Pareto concentration' },
      ])}
      <div class="grid g3">
        ${this.card('pf-seg','Recency segments','Customers by days since last order · LTV inside')}
        ${this.card('pf-ltv','Lifetime value leaders','Top 10 by PO value received','span2')}
      </div>
      <div class="grid g2">
        ${this.card('pf-since','Days since last order','Buying customers, longest gap first — the re-engagement list')}
        ${this.card('pf-win','Win rate by customer','Decided bids only (≥ 2 decisions) · bubble label shows decisions')}
      </div>
      <div class="card"><div class="card-head"><div><h3>Customer performance matrix</h3><p class="sub">Last order = most recent PO received · Days since = today − last order · Months = active relationship span (first RFQ → latest activity) · Lifetime value = PO received value (EUR) · click a customer name to open it</p></div></div><div id="perfTable"></div></div>`;
    Chart.donut(document.getElementById('pf-seg'), segs.map(s=>({label:s, value:(bySeg[s]||[]).length, color:segColor[s]})), { centerLabel:'customers', fmt:v=>v+' cust.' });
    Chart.hbar(document.getElementById('pf-ltv'), sortedLtv.slice(0,10).filter(m=>m.ltv>0).map(m=>({label:m.customer, value:m.ltv, color:'var(--st-po)', tip:`${m.pos} POs · last ${fmtDate(m.lastOrder)}`})), { fmt:eur, labelW:150, onClick:k=>this.setFilter('customer',k) });
    Chart.hbar(document.getElementById('pf-since'), matrix.filter(m=>m.since!==null).sort((a,b)=>b.since-a.since).slice(0,12).map(m=>({label:m.customer, value:m.since, color: segColor[m.segL], tip:`LTV ${eur(m.ltv)} · ${m.pos} POs`})), { fmt:v=>v+' d', labelW:150, onClick:k=>this.setFilter('customer',k) });
    Chart.hbar(document.getElementById('pf-win'), matrix.filter(m=>m.win!==null && (m.pos + byCu[m.customer].filter(r=>r.status==='Bid Lost').length) >= 2).sort((a,b)=>b.win-a.win).slice(0,12).map(m=>({label:m.customer, value:m.win, color: m.win>=0.6?'var(--st-po)':m.win>=0.4?'var(--st-pipe)':'var(--st-lost)', tip:`${m.pos} won · ${byCu[m.customer].filter(r=>r.status==='Bid Lost').length} lost`})), { fmt:v=>fmtPct(v), labelW:150, onClick:k=>this.setFilter('customer',k) });
    const cols = [
      { id:'customer', label:'Customer', key:'customer', render: m => `<a href="#" data-cust="${esc(m.customer)}" style="color:var(--text);font-weight:700;text-decoration:none">${esc(m.customer)}</a>` },
      { id:'country', label:'Country', key:'country' },
      { id:'seg', label:'Segment', key:'segL', render: m => `<span class="seg ${m.segC}">${m.segL}</span>` },
      { id:'lastOrder', label:'Last order', key:'lastOrder', render: m => fmtDate(m.lastOrder) },
      { id:'since', label:'Days since', key:'since', num:true, render: m => m.since===null?'—':`<b>${m.since}</b>` },
      { id:'months', label:'Months active', key:'months', num:true },
      { id:'ltv', label:'Lifetime value (EUR)', key:'ltv', num:true, render: m => `<div class="bar-cell" style="justify-content:flex-end"><i style="width:${Math.max(2,m.ltv/maxLtv*70)}px;opacity:${m.ltv?1:.15}"></i><span>${eurFull(m.ltv)}</span></div>` },
      { id:'pos', label:'POs', key:'pos', num:true },
      { id:'avgPO', label:'Avg PO', key:'avgPO', num:true, render: m => eur(m.avgPO) },
      { id:'rfqs', label:'RFQ count', key:'rfqs', num:true },
      { id:'quoted', label:'Quoted (EUR)', key:'quoted', num:true, render: m => eur(m.quoted) },
      { id:'win', label:'Win rate', key:'win', num:true, render: m => fmtPct(m.win) },
      { id:'open', label:'Open / pipeline', key:'open', num:true, render: m => m.open ? `${m.open} <span style="color:var(--muted)">(${eur(m.openVal)})</span>` : '—', csv: m => m.open },
      { id:'d2po', label:'Avg days to PO', key:'d2po', num:true },
      { id:'first', label:'First RFQ', key:'first', render: m => fmtDate(m.first) },
      { id:'lastRfq', label:'Latest RFQ', key:'lastRfq', render: m => fmtDate(m.lastRfq) },
    ];
    renderTable(document.getElementById('perfTable'), 'perf', matrix, cols, { sortKey:'ltv', sortDir:'desc', rowId: m => m.customer, cls:'matrix', pageSize: 100, csvName:'customer_performance' });
    document.getElementById('perfTable').addEventListener('click', e => { const a = e.target.closest('[data-cust]'); if (a) { e.preventDefault(); this.f.customer = a.dataset.cust; this.go('customer'); } });
  }
}

/* =====================================================================
   0. BOOT — load embedded data (file://) or fetch data.json (http://)
   ===================================================================== */
(async function boot(){
  let payload = null;
  const raw = document.getElementById('hp-data').textContent.trim();
  if (raw) { try { payload = JSON.parse(raw); } catch(e){ console.error('Embedded data invalid', e); } }
  if (!payload) {
    try { payload = await (await fetch('data.json')).json(); }
    catch(e){
      document.querySelector('.content').innerHTML = '<div class="card empty"><b>No data loaded</b>Run <code>python convert.py</code> next to HP.xlsx to embed the dataset into this file.</div>';
      return;
    }
  }
  window.APP = new App(payload);
})();
</script>
</body>
</html>
