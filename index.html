<!DOCTYPE html>
<html lang="en" data-theme="control">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Valves — RFQ Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THEMES — every colour is a semantic token; components never use raw hex
   ===================================================================== */
:root{
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --dur: 220ms; --ease: cubic-bezier(.2,.8,.2,1);
  /* status colours (colour-blind safe, also always paired with a label) */
  --st-po: #34B27A; --st-pipe: #E0A526; --st-open: #4C8DFF; --st-lost: #E5484D; --st-dec: #8A93A6;
  --shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 24px -12px rgba(0,0,0,.35);
}
[data-theme="control"]{
  --bg:#0F151D; --surface:#161E29; --surface-2:#1D2735; --surface-3:#243140;
  --border:#2A3646; --border-strong:#3A4A5E;
  --text:#E8EDF3; --text-2:#B6C1CF; --muted:#8B99AC;
  --accent:#D9A441; --accent-ink:#1A1408; --accent-soft:rgba(217,164,65,.14);
  --focus:#7FB2FF; --grid:#26313F; --pos:#34B27A; --neg:#E5484D;
}
[data-theme="datasheet"]{
  --bg:#CBDDE9; --surface:#FFFFFF; --surface-2:#EAF1F6; --surface-3:#DCE8F0;
  --border:#B4CBDB; --border-strong:#8AAEC6;
  --text:#12314A; --text-2:#2A4A63; --muted:#4E6D85;
  --accent:#2872A1; --accent-ink:#FFFFFF; --accent-soft:rgba(40,114,161,.14);
  --focus:#2872A1; --grid:#DDE8F0; --pos:#1E8E5A; --neg:#C8353A;
  --st-po:#1E8E5A; --st-pipe:#B07D10; --st-open:#2872A1; --st-lost:#C8353A; --st-dec:#6B7788;
  --shadow: 0 1px 2px rgba(18,49,74,.08), 0 8px 24px -14px rgba(18,49,74,.22);
}
[data-theme="boardroom"]{
  --bg:#0B1B33; --surface:#112646; --surface-2:#173157; --surface-3:#1E3B66;
  --border:#274672; --border-strong:#375A8C;
  --text:#F1F5FA; --text-2:#C5D2E3; --muted:#9BAEC7;
  --accent:#E2B75A; --accent-ink:#1A1408; --accent-soft:rgba(226,183,90,.16);
  --focus:#8FC1FF; --grid:#223E66; --pos:#3FC38A; --neg:#F0575C;
}

/* =====================================================================
   BASE
   ===================================================================== */
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* =====================================================================
   SHELL: sidebar + header/filters + content
   ===================================================================== */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:var(--s5) var(--s4);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:var(--s5)}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:15px;margin:0;font-weight:700;line-height:1.2}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;padding:0 var(--s3);border:0;background:transparent;border-radius:var(--r-md);text-align:left;cursor:pointer;color:var(--text-2);font-weight:600;font-size:14px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.6}
.side-foot b{color:var(--text-2);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:var(--s3) var(--s5)}
.top-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.top-row h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.top-row .spacer{flex:1}
.theme-switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.theme-switch button{min-height:32px;padding:0 var(--s3);border:0;border-radius:999px;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.theme-switch button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--s2);margin-top:var(--s3)}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted)}
.f select,.f input{min-height:40px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 var(--s3);font-size:13px;color:var(--text);transition:border-color var(--dur)}
.f select:hover,.f input:hover{border-color:var(--border-strong)}
.f select.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.f.search{grid-column:span 2}
.f-actions{display:flex;align-items:flex-end;gap:var(--s2)}
.btn{min-height:40px;padding:0 var(--s4);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background var(--dur),border-color var(--dur)}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{min-height:32px;padding:0 var(--s3);font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2);min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid transparent;color:var(--text);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.chip button:hover{background:var(--surface-3);color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;user-select:none;min-height:40px}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .tk{width:34px;height:20px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;transition:background var(--dur)}
.toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform var(--dur) var(--ease)}
.toggle input:checked + .tk{background:var(--accent);border-color:transparent}
.toggle input:checked + .tk::after{transform:translateX(14px);background:var(--accent-ink)}
.toggle input:focus-visible + .tk{outline:2px solid var(--focus);outline-offset:2px}

.content{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s5)}
.page{display:none;flex-direction:column;gap:var(--s5)}
.page.active{display:flex;animation:pagein var(--dur) var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* =====================================================================
   COMPONENTS
   ===================================================================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5)}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700}
.card .sub{margin:0 0 var(--s3);font-size:12px;color:var(--muted)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.grid{display:grid;gap:var(--s4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}

/* KPI hero — the executive value ribbon */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.hero-top{display:grid;grid-template-columns:1.4fr repeat(5,1fr);}
.kpi{padding:var(--s4) var(--s5);border-right:1px solid var(--border);position:relative;min-width:0}
.kpi:last-child{border-right:0}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .dot{width:9px;height:9px;border-radius:3px;flex:none}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0;line-height:1.1;white-space:nowrap}
.kpi.lead .val{font-size:34px;color:var(--accent)}
.kpi .meta{font-size:12.5px;color:var(--text-2);margin-top:6px;display:flex;gap:var(--s3);flex-wrap:wrap}
.kpi .meta b{font-weight:700;color:var(--text)}
.kpi .share{margin-top:10px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.kpi .share i{display:block;height:100%;border-radius:2px;transition:width 600ms var(--ease)}
.ribbon{display:flex;height:14px;border-top:1px solid var(--border)}
.ribbon span{display:block;height:100%;transition:width 600ms var(--ease);min-width:0}
.ribbon span:hover{filter:brightness(1.15)}
.ribbon-legend{display:flex;gap:var(--s4);flex-wrap:wrap;padding:var(--s2) var(--s5);font-size:12px;color:var(--text-2);border-top:1px solid var(--border)}
.ribbon-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Small KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.tile .val.warn{color:var(--st-lost)}
.tile .val.ok{color:var(--pos)}
.tile .hint{font-size:12px;color:var(--text-2);margin-top:2px}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--text-2);font-size:11.5px}
.chart .axis line,.chart .axis path{stroke:var(--grid)}
.chart .bar{transition:opacity var(--dur)}
.chart .bar:hover,.chart .seg:hover,.chart .arc:hover{opacity:.82;cursor:pointer}
.chart .lbl-val{fill:var(--text);font-weight:700}
.chart .lbl-cat{fill:var(--text-2)}
.chart .line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.12}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .center-val{font-size:22px;font-weight:800;fill:var(--text)}
.chart .center-lbl{fill:var(--muted)}
.legend{display:flex;gap:var(--s3) var(--s4);flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:var(--s2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text-2);font-size:14px;margin-bottom:4px}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity 120ms;max-width:280px;line-height:1.4}
#tip b{font-weight:700}
#tip.on{opacity:1}

/* Insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s3)}
.insight{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s3) var(--s4);border-left:3px solid var(--border-strong);font-size:13px;line-height:1.5}
.insight.risk{border-left-color:var(--st-lost)}
.insight.opp{border-left-color:var(--st-po)}
.insight.info{border-left-color:var(--st-open)}
.insight.warn{border-left-color:var(--st-pipe)}
.insight b{font-weight:700}
.insight .tag{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}

/* Entity lists (countries / customers) */
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
.entity{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3) var(--s4);cursor:pointer;text-align:left;width:100%;transition:border-color var(--dur),background var(--dur),transform var(--dur) var(--ease);min-height:44px}
.entity:hover{border-color:var(--border-strong);background:var(--surface-2)}
.entity[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.entity .name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entity .name small{font-weight:600;color:var(--muted);font-size:12px}
.entity .big{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.entity .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:6px}
.entity .row b{color:var(--text)}
.entity .mini{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-3);margin-top:8px}
.entity .mini i{display:block;height:100%}
.split{display:grid;grid-template-columns:300px 1fr;gap:var(--s4);align-items:start}
.list-pane{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;position:sticky;top:180px;max-height:calc(100vh - 200px);display:flex;flex-direction:column}
.list-pane .lp-head{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
.list-pane input{width:100%;min-height:38px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 var(--s3);font-size:13px}
.list-pane .lp-body{overflow:auto;flex:1}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px var(--s4);border:0;border-bottom:1px solid var(--border);background:transparent;width:100%;text-align:left;cursor:pointer;min-height:44px;color:var(--text)}
.lrow:hover{background:var(--surface-2)}
.lrow[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lrow .n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{font-weight:700;font-size:13px;text-align:right}
.lrow .m{grid-column:1/-1;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.lrow .m b{color:var(--text-2);font-weight:600}
.profile{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);align-items:baseline}
.profile h3{font-size:20px;margin:0;letter-spacing:-.01em}
.profile .pm{font-size:13px;color:var(--text-2)}
.profile .pm b{color:var(--text)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.po{color:var(--st-po)} .pill.pipe{color:var(--st-pipe)} .pill.open{color:var(--st-open)} .pill.lost{color:var(--st-lost)} .pill.dec{color:var(--st-dec)}
.due{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:700}
.due.over{background:rgba(229,72,77,.16);color:var(--st-lost)}
.due.soon{background:rgba(224,165,38,.18);color:var(--st-pipe)}
.due.ok{background:rgba(52,178,122,.16);color:var(--st-po)}
.seg{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11.5px;font-weight:700}
.seg.active{background:rgba(52,178,122,.16);color:var(--st-po)}
.seg.cooling{background:rgba(76,141,255,.16);color:var(--st-open)}
.seg.risk{background:rgba(224,165,38,.18);color:var(--st-pipe)}
.seg.dormant{background:rgba(229,72,77,.16);color:var(--st-lost)}
.seg.none{background:var(--surface-3);color:var(--muted)}
.bdg{display:inline-block;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:800;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}

/* Tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 12px;font-size:12px;font-weight:700;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
thead th:hover{color:var(--text)}
thead th.num,td.num{text-align:right}
thead th .arr{opacity:.35;margin-left:4px;font-size:10px}
thead th[aria-sort] .arr{opacity:1;color:var(--accent)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.exp{cursor:pointer}
tbody tr.detail td{background:var(--surface-2);padding:var(--s3) var(--s5);font-size:12.5px;color:var(--text-2)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s2) var(--s4)}
.detail-grid div b{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.detail-grid div span{color:var(--text);white-space:pre-wrap}
.detail-grid .wide{grid-column:1/-1}
td .desc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;color:var(--text-2)}
td.cust{font-weight:600}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager{display:flex;gap:6px;align-items:center}
.pager button{min-width:34px;min-height:34px}
.matrix td.num b{font-weight:700}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-cell i{display:block;height:6px;border-radius:3px;background:var(--accent);flex:none}
.bar-cell span{font-weight:700}

/* Data & upload page */
.drop{border:2px dashed var(--border-strong);border-radius:var(--r-lg);padding:var(--s6) var(--s5);text-align:center;background:var(--surface-2);transition:border-color var(--dur),background var(--dur);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h4{margin:0 0 4px;font-size:15px}
.drop p{margin:0;color:var(--muted);font-size:13px}
.drop input{display:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px var(--s4);font-size:13px}
.kv b{color:var(--muted);font-weight:600}
.log{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:12.5px;line-height:1.6;max-height:260px;overflow:auto}
.log .ok{color:var(--pos)} .log .bad{color:var(--neg)} .log .warn{color:var(--st-pipe)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:var(--s3);font-size:13px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:var(--s3);align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:12px}
.steps code,.sub code{background:var(--surface-3);padding:1px 6px;border-radius:4px;font-size:12px}

/* Responsive */
@media (max-width:1180px){ .hero-top{grid-template-columns:repeat(3,1fr)} .kpi:nth-child(3){border-right:0} .kpi{border-bottom:1px solid var(--border)} .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:260px 1fr} }
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);overflow-x:auto}
  .brand small,.side-foot,.nav .cnt{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:0 var(--s3)}
  .nav button span.t{display:none}
  .topbar{position:static}
  .content{padding:var(--s4)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .hero-top{grid-template-columns:repeat(2,1fr)}
  .kpi.lead{grid-column:1/-1}
  .split{grid-template-columns:1fr}
  .list-pane{position:static;max-height:360px}
  .f.search{grid-column:span 1}
}
@media print{ .side,.topbar .filters,.f-actions,.theme-switch{display:none} .page{display:flex!important} body{background:#fff;color:#000} }

<script>
/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;
const STATUS = ["PO Received","Under Pipeline",'Open Quote',"Bid Lost","RFQ Declined"];
const SCOLOR = {"PO Received":"var(--st-po)","Under Pipeline":"var(--st-pipe)",'Open Quote':"var(--st-open)","Bid Lost":"var(--st-lost)","RFQ Declined":"var(--st-dec)"};
const SCLASS = {"PO Received":"po","Under Pipeline":"pipe",'Open Quote':"open","Bid Lost":"lost","RFQ Declined":"dec"};
const COUNTRY_NAME = {KSA:"Saudi Arabia",UAE:"United Arab Emirates",PAK:"Pakistan",JRDN:"Jordan",QTR:"Qatar",BNG:"Bangladesh",BAH:"Bahrain",ALG:"Algeria",SIR:"Syria",TURK:"Türkiye",OMN:"Oman",KWT:"Kuwait",EGY:"Egypt",IRQ:"Iraq",IND:"India"};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SERIES = ["var(--accent)","var(--st-open)","var(--st-po)","var(--st-pipe)","var(--st-lost)","var(--st-dec)","#8E6BD8","#3AB5C9"];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (arr, f) => arr.reduce((a, r) => a + (f ? (f(r) || 0) : (r || 0)), 0);
const val = r => r.value || 0;
const uniq = arr => [...new Set(arr.filter(x => x !== null && x !== undefined && x !== ''))];
const pd = s => s ? new Date(s + 'T00:00:00') : null;
const daysBetween = (a, b) => (a && b) ? Math.round((pd(b) - pd(a)) / DAY) : null;
const daysSince = s => s ? Math.round((TODAY - pd(s)) / DAY) : null;
const daysUntil = s => s ? Math.round((pd(s) - TODAY) / DAY) : null;
const monthLabel = m => { if(!m) return ''; const [y,mm] = m.split('-'); return MONTHS[+mm-1] + ' ' + y.slice(2); };
const fmtDate = s => { if(!s) return '—'; const d = pd(s); return `${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtInt = n => n === null || n === undefined ? '—' : Math.round(n).toLocaleString('en-GB');
const fmtPct = (n, d=0) => (n === null || isNaN(n)) ? '—' : (n*100).toFixed(d) + '%';
function eur(n, compact=true){
  if (n === null || n === undefined || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (compact){
    if (a >= 1e6) return '€' + (n/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
    if (a >= 1e4) return '€' + (n/1e3).toFixed(1) + 'K';
  }
  return '€' + Math.round(n).toLocaleString('en-GB');
}
const eurFull = n => (n === null || n === undefined) ? '—' : '€' + Math.round(n).toLocaleString('en-GB');
const mean = arr => arr.length ? sum(arr) / arr.length : null;
const median = arr => { if(!arr.length) return null; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2? s[m] : (s[m-1]+s[m])/2; };
const groupBy = (rows, f) => rows.reduce((m, r) => { const k = f(r); (m[k] = m[k] || []).push(r); return m; }, {});
const debounce = (fn, ms=120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const dueClass = d => d === null ? '' : d < 0 ? 'over' : d <= 7 ? 'soon' : 'ok';
const dueText = d => d === null ? '—' : d < 0 ? `${-d}d overdue` : d === 0 ? 'Today' : `in ${d}d`;
function winRate(rows){ const po = rows.filter(r=>r.status==='PO Received').length, lost = rows.filter(r=>r.status==='Bid Lost').length; return (po+lost) ? po/(po+lost) : null; }
function pill(status){ return `<span class="pill ${SCLASS[status]||''}">${esc(status)}</span>`; }
function toCSV(rows, cols){
  const q = v => { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [cols.map(c=>q(c.label)).join(','), ...rows.map(r => cols.map(c => q(c.csv ? c.csv(r) : (typeof c.key === 'function' ? c.key(r) : r[c.key]))).join(','))].join('\n');
}
function download(name, text, mime='text/csv'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:mime})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 500); }

/* Tooltip */
const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.classList.add('on'); moveTip(e); }
function moveTip(e){ const x = e.clientX + 14, y = e.clientY + 14; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(x, innerWidth - w - 8) + 'px'; tip.style.top = (y + h > innerHeight - 8 ? e.clientY - h - 10 : y) + 'px'; }
function hideTip(){ tip.classList.remove('on'); }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(e, t.dataset.tip); });
document.addEventListener('mousemove', e => { if (tip.classList.contains('on')) moveTip(e); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });

/* =====================================================================
   2. SVG CHART ENGINE (no external libraries → works offline via file://)
   ===================================================================== */
const Chart = {
  /* Horizontal bars, optionally stacked. data: [{label, values:[..] or value, meta}] */
  hbar(el, data, opt={}){
    const W = Math.max(el.clientWidth || 480, 320), rowH = opt.rowH || 28, labelW = opt.labelW || 120, valW = opt.valW || 70;
    const H = data.length * rowH + 8;
    const series = opt.series || [{name:'Value'}];
    const stacked = data.length && Array.isArray(data[0].values);

    const max = Math.max(...totals, 1e-9);
    const x0 = labelW + 8, plotW = W - x0 - valW;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'bar chart')}">`;
    data.forEach((d, i) => {
      const y = i * rowH + 4;
      const name = d.label.length > 18 ? d.label.slice(0,17) + '…' : d.label;
      s += `<text x="${labelW}" y="${y + rowH/2 + 4}" text-anchor="end" class="lbl-cat">${esc(name)}</text>`;
      let x = x0;
      const vals = stacked ? d.values : [d.value];
      vals.forEach((v, k) => {
        const w = Math.max(0, v / max * plotW);
        const color = stacked ? (series[k].color || SERIES[k]) : (d.color || opt.color || SERIES[0]);
        const t = stacked ? `<b>${esc(d.label)}</b><br>${esc(series[k].name)}: ${opt.fmt ? opt.fmt(v) : v}<br>Total: ${opt.fmt ? opt.fmt(totals[i]) : totals[i]}` : `<b>${esc(d.label)}</b><br>${opt.fmt ? opt.fmt(v) : v}${d.tip ? '<br>' + d.tip : ''}`;
        if (w > 0) s += `<rect class="bar seg" x="${x}" y="${y + 5}" width="${w}" height="${rowH - 10}" rx="3" fill="${color}" data-tip="${esc(t)}" data-key="${esc(d.label)}"></rect>`;
        x += w;
      });
      s += `<text x="${x + 6}" y="${y + rowH/2 + 4}" class="lbl-val">${d.end !== undefined ? esc(d.end) : (opt.fmt ? opt.fmt(totals[i]) : totals[i])}</text>`;
    });
    s += '</svg>';
    el.innerHTML = data.length ? s + (stacked && opt.legend !== false ? legend(series) : '') : empty();
    if (opt.onClick) el.querySelectorAll('[data-key]').forEach(n => n.addEventListener('click', () => opt.onClick(n.dataset.key)));
  },

  /* Vertical columns + optional line overlay (combo). data: [{label, values:[..], line}] */
  combo(el, data, opt={}){
    const W = Math.max(el.clientWidth || 600, 320), H = opt.height || 240, padL = 48, padR = opt.line ? 56 : 12, padT = opt.labels ? 26 : 14, padB = 30;
    const series = opt.series || [{name:'Count'}];
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = data.length; if (!n) { el.innerHTML = empty(); return; }
    const totals = data.map(d => sum(d.values));
    const maxB = Math.max(...totals, 1e-9) * 1.08;
    const lineVals = data.map(d => d.line || 0), maxL = Math.max(...lineVals, 1e-9) * 1.08;
    const bw = plotW / n, barW = Math.min(bw * 0.62, 46);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'column chart')}">`;
    // grid
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) { const y = padT + plotH - plotH * i / ticks; const v = maxB * i / ticks; s += `<g class="axis"><line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/></g><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${opt.fmtY ? opt.fmtY(v) : Math.round(v)}</text>`; }
    if (opt.line) for (let i = 0; i <= ticks; i++) { const y = padT + plotH - plotH * i / ticks; s += `<text x="${W - padR + 8}" y="${y + 4}" fill="var(--accent)">${opt.fmtLine ? opt.fmtLine(maxL * i / ticks) : Math.round(maxL*i/ticks)}</text>`; }
    // bars
    data.forEach((d, i) => {
      const cx = padL + bw * i + bw / 2; let y = padT + plotH;
      d.values.forEach((v, k) => {
        const h = v / maxB * plotH; y -= h;
        const t = `<b>${esc(d.label)}</b><br>${esc(series[k].name)}: ${opt.fmt ? opt.fmt(v) : v}${d.values.length>1?`<br>Total: ${opt.fmt ? opt.fmt(totals[i]) : totals[i]}`:''}${d.line !== undefined && opt.line ? `<br>${esc(opt.line.name)}: ${opt.fmtLine ? opt.fmtLine(d.line) : d.line}` : ''}`;
        if (h > 0) s += `<rect class="bar seg" x="${cx - barW/2}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${series[k].color || SERIES[k]}" data-tip="${esc(t)}" data-key="${esc(d.key ?? d.label)}"/>`;
      });
      if (opt.labels && totals[i] > 0) s += `<text x="${cx}" y="${y - 4}" text-anchor="middle" class="lbl-val" style="font-size:10.5px">${opt.fmt ? opt.fmt(totals[i]) : totals[i]}</text>`;
      const every = Math.ceil(n / Math.floor(plotW / 54));
      if (i % every === 0 || n <= 12) s += `<text x="${cx}" y="${H - 10}" text-anchor="middle">${esc(d.label)}</text>`;
    });
    // line
    if (opt.line) {
      const pts = data.map((d, i) => [padL + bw * i + bw / 2, padT + plotH - (d.line || 0) / maxL * plotH]);
      s += `<path class="line" stroke="var(--accent)" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`;
      pts.forEach((p, i) => { s += `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)" data-tip="<b>${esc(data[i].label)}</b><br>${esc(opt.line.name)}: ${opt.fmtLine ? opt.fmtLine(data[i].line) : data[i].line}"/>`;
        if (opt.labels && data[i].line) s += `<text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" style="font-size:10px;font-weight:700" fill="var(--accent)">${opt.fmtLine ? opt.fmtLine(data[i].line) : data[i].line}</text>`; });
    }
    s += '</svg>';
    const lg = [...series.map((x,i)=>({name:x.name, color:x.color||SERIES[i]}))]; if (opt.line) lg.push({name:opt.line.name, color:'var(--accent)', line:true});
    el.innerHTML = s + (opt.legend !== false ? legend(lg) : '');
    if (opt.onClick) el.querySelectorAll('[data-key]').forEach(nd => nd.addEventListener('click', () => opt.onClick(nd.dataset.key)));
  },

  /* Line chart with area. data: [{label, value}] */
  line(el, data, opt={}){
    const W = Math.max(el.clientWidth || 600, 320), H = opt.height || 220, padL = 44, padR = 12, padT = 14, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB, n = data.length;
    if (n < 2) { el.innerHTML = empty('Not enough periods to plot a trend'); return; }
    const vals = data.map(d => d.value ?? 0), max = opt.max ?? Math.max(...vals, 1e-9) * 1.1, min = 0;
    const X = i => padL + plotW * i / (n - 1), Y = v => padT + plotH - (v - min) / (max - min) * plotH;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'line chart')}">`;
    for (let i = 0; i <= 4; i++) { const y = padT + plotH * i / 4; const v = max - (max - min) * i / 4; s += `<g class="axis"><line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/></g><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${opt.fmtY ? opt.fmtY(v) : Math.round(v)}</text>`; }
    const path = data.map((d, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d.value ?? 0).toFixed(1)).join(' ');
    s += `<path class="area" d="${path} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="${opt.color||'var(--accent)'}"/>`;
    s += `<path class="line" stroke="${opt.color||'var(--accent)'}" d="${path}"/>`;
    data.forEach((d, i) => { s += `<circle class="pt" cx="${X(i)}" cy="${Y(d.value ?? 0)}" r="4" fill="${opt.color||'var(--accent)'}" data-tip="<b>${esc(d.label)}</b><br>${opt.fmt ? opt.fmt(d.value) : d.value}${d.tip?'<br>'+d.tip:''}"/>`;
      const every = Math.ceil(n / Math.floor(plotW / 54)); if (i % every === 0 || n <= 12) s += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle">${esc(d.label)}</text>`; });
    el.innerHTML = s + '</svg>';
  },

  /* Donut with centre KPI. data: [{label, value, color}] */
  donut(el, data, opt={}){
    const size = opt.size || 200, r = size / 2 - 6, ri = r * 0.64, cx = size / 2, cy = size / 2;
    const total = sum(data, d => d.value); if (!total) { el.innerHTML = empty(); return; }
    let a = -Math.PI / 2, s = `<svg viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto" role="img" aria-label="${esc(opt.aria||'donut chart')}">`;
    data.filter(d => d.value > 0).forEach((d, i) => {
      const ang = d.value / total * Math.PI * 2, a2 = a + ang, large = ang > Math.PI ? 1 : 0;
      const p = (rad, t) => [cx + rad * Math.cos(t), cy + rad * Math.sin(t)];
      const [x1,y1] = p(r,a), [x2,y2] = p(r,a2), [x3,y3] = p(ri,a2), [x4,y4] = p(ri,a);
      const dpath = ang >= Math.PI*2 - 1e-6 ? `M${cx+r} ${cy} A${r} ${r} 0 1 1 ${cx-r} ${cy} A${r} ${r} 0 1 1 ${cx+r} ${cy} M${cx+ri} ${cy} A${ri} ${ri} 0 1 0 ${cx-ri} ${cy} A${ri} ${ri} 0 1 0 ${cx+ri} ${cy}` : `M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 ${large} 0 ${x4} ${y4} Z`;
      s += `<path class="arc" d="${dpath}" fill="${d.color || SERIES[i]}" fill-rule="evenodd" data-tip="<b>${esc(d.label)}</b><br>${opt.fmt ? opt.fmt(d.value) : d.value} (${fmtPct(d.value/total)})" data-key="${esc(d.label)}"/>`;
      a = a2;
    });
    s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="center-val">${opt.center ?? fmtInt(total)}</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" class="center-lbl">${esc(opt.centerLabel || 'total')}</text></svg>`;
    el.innerHTML = `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${s}<div class="legend" style="flex-direction:column;gap:6px;margin:0">${data.map((d,i)=>`<span><i style="background:${d.color||SERIES[i]}"></i>${esc(d.label)} <b style="color:var(--text)">${opt.fmt ? opt.fmt(d.value) : d.value}</b> <span style="color:var(--muted)">${fmtPct(d.value/total)}</span></span>`).join('')}</div></div>`;
    if (opt.onClick) el.querySelectorAll('[data-key]').forEach(n => n.addEventListener('click', () => opt.onClick(n.dataset.key)));
  }
};
function legend(items){ return `<div class="legend">${items.map((x,i)=>`<span><i style="background:${x.color||SERIES[i]}${x.line?';height:3px;border-radius:2px;vertical-align:3px':''}"></i>${esc(x.name)}</span>`).join('')}</div>`; }
function empty(msg){ return `<div class="empty"><b>No records match</b>${esc(msg || 'Widen the filters or press Reset.')}</div>`; }

/* =====================================================================
   3. TABLE COMPONENT — sortable, expandable rows, CSV export, paging
   ===================================================================== */
const TableState = {};
function renderTable(host, id, rows, cols, opt={}){
  const st = TableState[id] = TableState[id] || { sortKey: opt.sortKey || null, dir: opt.sortDir || 'asc', page: 0, size: opt.pageSize || 25, open: new Set() };
  if (opt.resetPage) st.page = 0;
  const get = (r, c) => typeof c.key === 'function' ? c.key(r) : r[c.key];
  let data = [...rows];
  if (st.sortKey) {
    const c = cols.find(x => x.id === st.sortKey);
    if (c) data.sort((a, b) => { let va = get(a, c), vb = get(b, c); const na = va === null || va === undefined || va === '', nb = vb === null || vb === undefined || vb === ''; if (na && nb) return 0; if (na) return 1; if (nb) return -1; if (typeof va === 'number' && typeof vb === 'number') return st.dir === 'asc' ? va - vb : vb - va; va = String(va); vb = String(vb); return st.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); });
  }
  const pages = Math.max(1, Math.ceil(data.length / st.size)); st.page = Math.min(st.page, pages - 1);
  const slice = data.slice(st.page * st.size, (st.page + 1) * st.size);
  let h = `<div class="tbl-wrap"><table class="${opt.cls||''}"><thead><tr>`;
  cols.forEach(c => h += `<th class="${c.num?'num':''}" data-col="${c.id}" ${st.sortKey===c.id?`aria-sort="${st.dir==='asc'?'ascending':'descending'}"`:''} role="button" tabindex="0">${esc(c.label)}<span class="arr">${st.sortKey===c.id ? (st.dir==='asc'?'▲':'▼') : '↕'}</span></th>`);
  h += '</tr></thead><tbody>';
  slice.forEach(r => {
    const rid = opt.rowId ? opt.rowId(r) : r.id;
    h += `<tr class="${opt.detail?'exp':''}" data-rid="${esc(rid)}">` + cols.map(c => `<td class="${c.num?'num':''} ${c.cls||''}">${c.render ? c.render(r) : esc(get(r, c) ?? '—')}</td>`).join('') + '</tr>';
    if (opt.detail && st.open.has(String(rid))) h += `<tr class="detail"><td colspan="${cols.length}">${opt.detail(r)}</td></tr>`;
  });
  if (!slice.length) h += `<tr><td colspan="${cols.length}">${empty()}</td></tr>`;
  h += `</tbody></table></div><div class="tbl-foot"><span>${data.length.toLocaleString()} rows${opt.detail ? ' · click a row for full details' : ''}</span><div class="pager">`;
  if (pages > 1) h += `<button class="btn sm" data-pg="prev" ${st.page===0?'disabled':''}>‹</button><span>${st.page+1} / ${pages}</span><button class="btn sm" data-pg="next" ${st.page>=pages-1?'disabled':''}>›</button>`;
  h += `<button class="btn sm" data-csv="1"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Export CSV</button></div></div>`;
  host.innerHTML = h;
  host.querySelectorAll('th').forEach(th => { const go = () => { const k = th.dataset.col; if (st.sortKey === k) st.dir = st.dir === 'asc' ? 'desc' : 'asc'; else { st.sortKey = k; st.dir = cols.find(c=>c.id===k).num ? 'desc' : 'asc'; } renderTable(host, id, rows, cols, opt); }; th.addEventListener('click', go); th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  host.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => { st.page += b.dataset.pg === 'next' ? 1 : -1; renderTable(host, id, rows, cols, opt); }));
  host.querySelector('[data-csv]').addEventListener('click', () => download((opt.csvName || id) + '.csv', toCSV(data, cols)));
  if (opt.detail) host.querySelectorAll('tr.exp').forEach(tr => tr.addEventListener('click', () => { const k = tr.dataset.rid; st.open.has(k) ? st.open.delete(k) : st.open.add(k); renderTable(host, id, rows, cols, opt); }));
}

function rfqDetail(r){

/* =====================================================================
   3b. EXCEL INGEST — JavaScript port of convert.py (same rules, same output)
   ===================================================================== */
const XL_COLUMNS = {"SY":"sy","Week Num":"week","Country":"country","Customer":"customer","Deal Name":"deal","Deal Owner":"owner","RFQ Received":"rfq","Closing Date":"close","Tender Category":"category","Description":"desc","Rfx Type":"rfx","Vendor":"vendor","Internal Ref.":"ref","HP QTN REFERENCE":"hpRef","Value":"value","Stage":"stage","Staus":"status","Status":"status","QTN Date":"qtn","MGE Cost Price":"cost","Clarification Received":"clarRecv","Clarification Completed":"clarDone","Declined Reason":"declined","Bid Feedback":"feedback","PO Received":"po"};
const XL_DATES = ["rfq","close","qtn","clarRecv","clarDone","po"];
const XL_NULLS = ["sy","week","value","cost"];
const XL_STATUS_ALIAS = {"open rfq":"Open Quote","open rfqs":"Open Quote","open rfq's":"Open Quote","open quote":"Open Quote","open quotes":"Open Quote","open quotation":"Open Quote","po received":"PO Received","under pipeline":"Under Pipeline","bid lost":"Bid Lost","rfq declined":"RFQ Declined","declined":"RFQ Declined"};
const XL_DECLINE = [["No supplier quote",/supplier|no quote received|quoted to esnad|for esnad|awarded to hp|pre ?payment|agent/],["Insufficient details",/detail|information|not matching|no sec bid/],["Out of scope",/out of scope|not in .*sow|scope/],["Portal / deadline",/portal|deadline|due date|closure|submit/],["Duplicate / re-floated",/refloat|already|po received|duplicate/],["Not quoted",/not quoted/]];
function xlText(v){ if (v === null || v === undefined) return ''; const s = String(v).replace(/\r\n?/g,'\n').trim(); return /^(nan|nat|none)$/i.test(s) ? '' : s; }
function xlNum(v){ if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return isNaN(v) ? null : v; const s = String(v).replace(/[^\d.\-]/g,''); if (!s || s === '-' || s === '.' ) return null; const n = parseFloat(s); return isNaN(n) ? null : n; }
function xlIso(v){
  if (v === null || v === undefined || v === '') return null;
  let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number' && v > 20000 && v < 80000) { const o = XLSX.SSF.parse_date_code(v); if (o) d = new Date(o.y, o.m - 1, o.d); }
  else { const t = String(v).trim(); const m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) d = new Date(+m[1], +m[2]-1, +m[3]); else { const m2 = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m2) d = new Date(+m2[3], +m2[2]-1, +m2[1]); else { const p = new Date(t); if (!isNaN(p)) d = p; } } }
  if (!d || isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function xlBucket(t){ t = (t||'').toLowerCase(); if (!t) return 'No reason recorded'; for (const [l, re] of XL_DECLINE) if (re.test(t)) return l; return 'Other'; }
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0) / DAY + 1) / 7); }
function parseWorkbook(buf, fileName){
  const log = [];
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const sheetName = wb.SheetNames.find(n => n.trim().toUpperCase() === 'MAIN TABLE') || wb.SheetNames[0];
  log.push(['', `Sheet: <b>${esc(sheetName)}</b> (workbook has ${wb.SheetNames.length})`]);
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:null, raw:true });
  const headers = raw.length ? Object.keys(raw[0]).map(h => h.trim()) : [];
  const missing = Object.keys(XL_COLUMNS).filter(h => !headers.includes(h) && h !== 'Status' && h !== 'Staus');
  if (!headers.includes('Staus') && !headers.includes('Status')) missing.push('Staus/Status');
  if (missing.length) log.push(['warn', `Headers not found (left blank): ${esc(missing.join(', '))}`]);
  const rows = []; let skipped = 0;
  raw.forEach(rec => {
    const norm = {}; Object.keys(rec).forEach(k => norm[k.trim()] = rec[k]);
    if (xlText(norm['Customer']) === '' && xlIso(norm['RFQ Received']) === null) { skipped++; return; }
    const r = { id: rows.length + 1 };
    Object.entries(XL_COLUMNS).forEach(([col, key]) => {
      if (!(col in norm)) { if (!(key in r)) r[key] = (XL_DATES.includes(key) || XL_NULLS.includes(key)) ? null : ''; return; }
      const v = norm[col];
      if (XL_DATES.includes(key)) r[key] = xlIso(v); else if (key === 'value' || key === 'cost') r[key] = xlNum(v); else if (key === 'sy' || key === 'week') { const n = xlNum(v); r[key] = n === null ? null : Math.round(n); } else r[key] = xlText(v); });
    const sk = r.status.trim().toLowerCase().replace(/\s+/g,' ').replace(/’/g,"'"); r.status = XL_STATUS_ALIAS[sk] || r.status.trim() || 'Unknown';
    if (r.rfq) { const d = pd(r.rfq); r.year = d.getFullYear(); r.quarter = 'Q' + (Math.floor(d.getMonth()/3)+1); r.month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; if (r.week === null) r.week = isoWeek(d); if (r.sy === null) r.sy = d.getFullYear(); }
    else { r.year = r.sy; r.quarter = null; r.month = null; }
    const blob = `${r.desc} ${r.feedback}`.toLowerCase(); r.budgetary = /bdgtry|budgetory|budgetary|budgetry|indicative/.test(blob);
    r.declinedGroup = r.status === 'RFQ Declined' ? xlBucket(r.declined) : '';
    r.daysToClose = daysBetween(r.rfq, r.close); r.daysToQtn = daysBetween(r.rfq, r.qtn); r.daysToPO = daysBetween(r.rfq, r.po); r.daysClarification = daysBetween(r.clarRecv, r.clarDone);
    rows.push(r);
  });
  if (skipped) log.push(['warn', `${skipped} empty rows skipped`]);
  const u = k => uniq(rows.map(r => r[k])).sort((a,b)=>String(a).localeCompare(String(b)));
  const statuses = STATUS.filter(s => rows.some(r => r.status === s)).concat(u('status').filter(s => !STATUS.includes(s)));
  const dates = rows.map(r => r.rfq).filter(Boolean).sort();
  const n = new Date();
  const meta = { title:'HP Valves — RFQ Intelligence', source:fileName, sheet:sheetName, generated:`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`, currency:'EUR', rowCount:rows.length, dateRange:[dates[0]||null, dates[dates.length-1]||null], statuses, countries:u('country'), customers:u('customer'), vendors:u('vendor'), owners:u('owner'), years:u('year') };
  log.push(['ok', `${rows.length} RFQ lines · ${meta.customers.length} customers · ${meta.countries.length} countries · ${fmtDate(meta.dateRange[0])} → ${fmtDate(meta.dateRange[1])}`]);
  STATUS.forEach(s => { const g = rows.filter(r => r.status === s); log.push(['', `${esc(s)}: ${g.length} RFQs · ${eurFull(sum(g, val))}`]); });
  const unk = statuses.filter(s => !STATUS.includes(s)); if (unk.length) log.push(['warn', `Unrecognised status values: ${esc(unk.join(', '))}`]);
  const unpriced = rows.filter(r => r.value === null).length; if (unpriced) log.push(['', `${unpriced} lines without a value (blank or “--”)`]);
  return { payload:{ meta, rows }, log };
}

   ===================================================================== */
const PAGES = [
  { id:'exec', title:'Executive summary', icon:'<path d="M4 19V5m0 14h16M8 15v-4m4 4V8m4 7v-2"/>' },
  { id:'country', title:'Countries', icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>' },
  { id:'customer', title:'Customers', icon:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },
  { id:'open', title:'Open quotes', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
  { id:'pipeline', title:'Under pipeline', icon:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 6v12"/>' },
  { id:'perf', title:'Customer performance', icon:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>' },
  { id:'data', title:'Data & upload', icon:'<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>' },
];
const FILTERS = [
  { id:'year', label:'Year', plural:'years', key:'year' },
  { id:'quarter', label:'Quarter', plural:'quarters', key:'quarter' },
  { id:'month', label:'Month', plural:'months', key:'month', fmt: monthLabel },
  { id:'week', label:'Week', plural:'weeks', key:'week', fmt: w => 'W' + w },
  { id:'country', label:'Country', plural:'countries', key:'country', fmt: c => COUNTRY_NAME[c] ? `${c} · ${COUNTRY_NAME[c]}` : c },
  { id:'customer', label:'Customer', plural:'customers', key:'customer' },
  { id:'status', label:'Status', plural:'statuses', key:'status' },
  { id:'vendor', label:'Vendor', plural:'vendors', key:'vendor' },
];

class App {
  constructor(payload, origin){
    this.meta = payload.meta; this.rows = payload.rows; this.origin = origin || 'embedded data'; this.uploadLog = '';
    this.f = {}; FILTERS.forEach(x => this.f[x.id] = '');
    this.search = ''; this.exclBudget = false; this.page = 'exec';
    this.custSearch = '';
    try { const t = localStorage.getItem('hp-theme'); if (t) this.setTheme(t, false); } catch(e){}
    this.buildNav(); this.buildFilters(); this.bind();
    this.render();
    addEventListener('resize', debounce(() => this.render(), 150));
  }

  /* ---------- filtering ---------- */
  filtered(except){
    const q = this.search.toLowerCase();
    return this.rows.filter(r => {
      if (this.exclBudget && r.budgetary) return false;
      for (const fl of FILTERS) { if (fl.id === except) continue; const v = this.f[fl.id]; if (v !== '' && String(r[fl.key]) !== String(v)) return false; }
      if (q && !(`${r.customer} ${r.deal} ${r.desc} ${r.ref} ${r.hpRef} ${r.owner} ${r.stage} ${r.feedback} ${r.declined}`.toLowerCase().includes(q))) return false;
      return true;
    });
  }
  setFilter(id, v){ this.f[id] = v; if (id === 'year' && v === '') { /* keep sub-periods */ } this.render(); }
  reset(){ FILTERS.forEach(x => this.f[x.id] = ''); this.search = ''; document.getElementById('f-search').value = ''; this.exclBudget = false; document.getElementById('exclBudget').checked = false; this.custSearch = ''; this.render(); }

  /* ---------- theme ---------- */
  setTheme(t, save=true){ document.documentElement.dataset.theme = t; document.querySelectorAll('.theme-switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === t)); if (save) try { localStorage.setItem('hp-theme', t); } catch(e){} }

  /* ---------- shell ---------- */
  buildNav(){
    document.getElementById('nav').innerHTML = PAGES.map(p => `<button role="tab" data-page="${p.id}" aria-selected="${p.id===this.page}"><svg viewBox="0 0 24 24">${p.icon}</svg><span class="t">${p.title}</span><span class="cnt" id="cnt-${p.id}"></span></button>`).join('');
    document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) this.go(b.dataset.page); });
    this.footer();
  }
  go(page){ this.page = page; document.querySelectorAll('#nav [data-page]').forEach(b => b.setAttribute('aria-selected', b.dataset.page === page)); document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page)); document.getElementById('pageTitle').textContent = PAGES.find(p => p.id === page).title; this.render(); scrollTo({top:0}); }
  buildFilters(){
    const h = FILTERS.map(fl => `<div class="f"><label for="f-${fl.id}">${fl.label}</label><select id="f-${fl.id}" data-f="${fl.id}"></select></div>`).join('')
      + `<div class="f search"><label for="f-search">Search</label><input id="f-search" type="search" placeholder="Customer, ref, description, feedback…"></div>
         <div class="f-actions"><button class="btn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset filters</button></div>`;
    document.getElementById('filters').innerHTML = h;
  }
  bind(){
    document.getElementById('filters').addEventListener('change', e => { const s = e.target.closest('select[data-f]'); if (s) this.setFilter(s.dataset.f, s.value); });
    document.getElementById('f-search').addEventListener('input', debounce(e => { this.search = e.target.value.trim(); this.render(); }, 200));
    document.getElementById('resetBtn').addEventListener('click', () => this.reset());
    document.getElementById('exclBudget').addEventListener('change', e => { this.exclBudget = e.target.checked; this.render(); });
    document.querySelector('.theme-switch').addEventListener('click', e => { const b = e.target.closest('[data-theme]'); if (b) this.setTheme(b.dataset.theme); });
    document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('[data-clear]'); if (b) { if (b.dataset.clear === 'search') { this.search=''; document.getElementById('f-search').value=''; } else this.f[b.dataset.clear] = ''; this.render(); } });
  }
  refreshFilterOptions(){
    FILTERS.forEach(fl => {
      const pool = this.filtered(fl.id);                       // cascading: options reflect the other active filters
      let opts = uniq(pool.map(r => r[fl.key]));
      if (fl.id === 'year' || fl.id === 'week') opts.sort((a,b)=>a-b); else if (fl.id === 'status') opts = STATUS.filter(s => opts.includes(s)).concat(opts.filter(s => !STATUS.includes(s))); else opts.sort();
      const sel = document.getElementById('f-' + fl.id); const cur = this.f[fl.id];
      if (cur !== '' && !opts.map(String).includes(String(cur))) opts.push(cur);
      sel.innerHTML = `<option value="">All ${fl.plural} (${opts.length})</option>` + opts.map(o => `<option value="${esc(o)}" ${String(o)===String(cur)?'selected':''}>${esc(fl.fmt ? fl.fmt(o) : o)}</option>`).join('');
      sel.classList.toggle('active', cur !== '');
    });
    const chips = FILTERS.filter(fl => this.f[fl.id] !== '').map(fl => `<span class="chip">${fl.label}: ${esc(fl.fmt ? fl.fmt(this.f[fl.id]) : this.f[fl.id])}<button data-clear="${fl.id}" aria-label="Clear ${fl.label} filter">✕</button></span>`);
    if (this.search) chips.push(`<span class="chip">Search: “${esc(this.search)}”<button data-clear="search" aria-label="Clear search">✕</button></span>`);
    if (this.exclBudget) chips.push(`<span class="chip">Budgetary quotes excluded</span>`);
    document.getElementById('chips').innerHTML = chips.join('');
  }

  /* ---------- render dispatcher ---------- */
  render(){
    this.refreshFilterOptions();
    const rows = this.filtered();
    document.getElementById('cnt-exec').textContent = rows.length;
    document.getElementById('cnt-country').textContent = uniq(rows.map(r=>r.country)).length;
    document.getElementById('cnt-customer').textContent = uniq(rows.map(r=>r.customer)).length;
    document.getElementById('cnt-open').textContent = rows.filter(r=>r.status==='Open Quote').length;
    document.getElementById('cnt-pipeline').textContent = rows.filter(r=>r.status==='Under Pipeline').length;
    document.getElementById('cnt-perf').textContent = uniq(rows.filter(r=>r.status==='PO Received').map(r=>r.customer)).length;
    document.getElementById('cnt-data').textContent = this.rows.length;
    ({ exec: () => this.renderExec(rows), country: () => this.renderCountry(rows), customer: () => this.renderCustomer(rows), open: () => this.renderOpen(rows), pipeline: () => this.renderPipeline(rows), perf: () => this.renderPerf(rows), data: () => this.renderData() })[this.page]();
  }

  /* ---------- shared blocks ---------- */
  statusStats(rows){ return STATUS.map(s => { const g = rows.filter(r => r.status === s); return { status: s, count: g.length, value: sum(g, val) }; }); }
  monthly(rows){
    const g = groupBy(rows.filter(r => r.month), r => r.month); const keys = Object.keys(g).sort();
    return keys.map(k => ({ key:k, label: monthLabel(k), rows: g[k] }));
  }
  heroHTML(rows){
    const total = sum(rows, val), st = this.statusStats(rows), tv = Math.max(total, 1e-9);
    const priced = rows.filter(r => r.value !== null).length;
    const kpi = (s) => `<div class="kpi"><div class="lbl"><i class="dot" style="background:${SCOLOR[s.status]}"></i>${esc(s.status)}</div><div class="val">${eur(s.value)}</div><div class="meta"><span><b>${s.count}</b> RFQs</span><span>${fmtPct(s.count/Math.max(rows.length,1))} of count</span></div><div class="share"><i style="width:${(s.value/tv*100).toFixed(1)}%;background:${SCOLOR[s.status]}"></i></div></div>`;
    return `<div class="hero"><div class="hero-top">
      <div class="kpi lead"><div class="lbl">Total quoted value</div><div class="val">${eur(total)}</div><div class="meta"><span><b>${rows.length}</b> RFQs</span><span><b>${priced}</b> priced</span><span>${eurFull(total)}</span></div></div>
      ${st.map(kpi).join('')}</div>
      <div class="ribbon" aria-hidden="true">${st.map(s => `<span style="width:${(s.value/tv*100).toFixed(2)}%;background:${SCOLOR[s.status]}" data-tip="<b>${esc(s.status)}</b><br>${eurFull(s.value)} · ${fmtPct(s.value/tv,1)} of value"></span>`).join('')}</div>
      <div class="ribbon-legend"><span>Value share by status</span>${st.map(s=>`<span><i style="background:${SCOLOR[s.status]}"></i>${fmtPct(s.value/tv,1)} ${esc(s.status)}</span>`).join('')}</div></div>`;
  }
  tilesHTML(list){ return `<div class="tiles">${list.map(t => `<div class="tile"><div class="lbl">${esc(t.lbl)}</div><div class="val ${t.cls||''}">${t.val}</div>${t.hint?`<div class="hint">${t.hint}</div>`:''}</div>`).join('')}</div>`; }
  card(id, title, sub, extra='', style=''){ return `<div class="card ${extra}" style="${style}"><div class="card-head"><div><h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p></div></div><div class="chart" id="${id}"></div></div>`; }

  /* =========================== 1. EXECUTIVE =========================== */
  renderExec(rows){
    const el = document.getElementById('page-exec');
    const months = this.monthly(rows);
    el.innerHTML = `
      ${this.heroHTML(rows)}
      <div class="grid g3">
        ${this.card('c-monthly','RFQ intake by month','Columns = RFQ count by status (total above) · line = quoted value (EUR)','span2')}
        ${this.card('c-status','Status mix','Share of RFQ count — click a slice to filter')}
      </div>
      <div class="grid g3">
        ${this.card('c-country','Quoted value by country','Stacked by status · click a bar to drill into the country')}
        ${this.card('c-customers','Top customers by quoted value','Stacked by status · top 10 · click to drill')}
        ${this.card('c-winrate','Win rate trend','PO received ÷ (PO received + bid lost), by RFQ month')}
      </div>
      <div class="grid g3">
        ${this.card('c-cycle','RFQ turnaround (received → closing)','Distribution of days allowed to close an RFQ')}
        ${this.card('c-declined','Why RFQs were declined','Free-text reasons grouped into categories')}
        ${this.card('c-owner','Deal owner workload','RFQ count and won POs per owner')}
      </div>`;

    // Monthly combo
    Chart.combo(document.getElementById('c-monthly'), months.map(m => ({ key:m.key, label:m.label, values: STATUS.map(s => m.rows.filter(r=>r.status===s).length), line: sum(m.rows, val) })),
      { series: STATUS.map(s=>({name:s, color:SCOLOR[s]})), line:{name:'Quoted value'}, fmtLine: v=>eur(v), labels:true, aria:'RFQ intake by month', onClick: k => this.setFilter('month', k) });
    // Status donut
    const st = this.statusStats(rows);
    Chart.donut(document.getElementById('c-status'), st.map(s=>({label:s.status, value:s.count, color:SCOLOR[s.status]})), { centerLabel:'RFQs', aria:'Status mix', onClick: k => this.setFilter('status', k) });
    // Country stacked
    const byC = groupBy(rows, r=>r.country);
    const cData = Object.keys(byC).map(c => ({ label:c, values: STATUS.map(s => sum(byC[c].filter(r=>r.status===s), val)) })).sort((a,b)=>sum(b.values)-sum(a.values)).slice(0,10);
    Chart.hbar(document.getElementById('c-country'), cData, { series: STATUS.map(s=>({name:s,color:SCOLOR[s]})), fmt: eur, labelW: 60, legend:false, aria:'Value by country', onClick: k => { this.setFilter('country', k); } });
    // Customers stacked
    const byCu = groupBy(rows, r=>r.customer);
    const cuData = Object.keys(byCu).map(c => ({ label:c, values: STATUS.map(s => sum(byCu[c].filter(r=>r.status===s), val)) })).sort((a,b)=>sum(b.values)-sum(a.values)).slice(0,10);
    Chart.hbar(document.getElementById('c-customers'), cuData, { series: STATUS.map(s=>({name:s,color:SCOLOR[s]})), fmt: eur, legend:false, aria:'Top customers', onClick: k => this.setFilter('customer', k) });
    // Win rate
    Chart.line(document.getElementById('c-winrate'), months.filter(m => m.rows.some(r => r.status==='PO Received'||r.status==='Bid Lost')).map(m => { const w = winRate(m.rows); const po=m.rows.filter(r=>r.status==='PO Received').length, lost=m.rows.filter(r=>r.status==='Bid Lost').length; return { label:m.label, value: w ?? 0, tip:`${po} won · ${lost} lost` }; }), { fmt: v=>fmtPct(v), fmtY: v=>fmtPct(v), max:1, color:'var(--st-po)', aria:'Win rate trend' });
    // Cycle time buckets
    const buckets = [['0–3 days',0,3],['4–7 days',4,7],['8–14 days',8,14],['15–30 days',15,30],['31+ days',31,1e9]];
    Chart.hbar(document.getElementById('c-cycle'), buckets.map(([l,a,b]) => ({ label:l, value: rows.filter(r => r.daysToClose !== null && r.daysToClose >= a && r.daysToClose <= b).length })), { color:'var(--st-open)', fmt: v=>v+' RFQs', labelW:80, aria:'Turnaround buckets' });
    // Declined reasons
    const dec = groupBy(rows.filter(r=>r.status==='RFQ Declined'), r=>r.declinedGroup||'No reason recorded');
    Chart.hbar(document.getElementById('c-declined'), Object.keys(dec).map(k=>({label:k, value:dec[k].length, color:'var(--st-dec)'})).sort((a,b)=>b.value-a.value), { fmt:v=>v, labelW:140, aria:'Declined reasons' });
    // Owners
    const byO = groupBy(rows, r=>r.owner||'Unassigned');
    Chart.hbar(document.getElementById('c-owner'), Object.keys(byO).map(k=>({label:k, values:[byO[k].filter(r=>r.status==='PO Received').length, byO[k].filter(r=>r.status!=='PO Received').length]})).sort((a,b)=>sum(b.values)-sum(a.values)), { series:[{name:'Won (PO)',color:'var(--st-po)'},{name:'Other RFQs',color:'var(--st-open)'}], fmt:v=>v, labelW:120, aria:'Owner workload' });
  }

  insights(rows){
    const out = [];
    if (!rows.length) return out;
    const total = sum(rows, val), st = Object.fromEntries(this.statusStats(rows).map(s=>[s.status,s]));
    const budget = rows.filter(r => r.budgetary && !this.exclBudget), bv = sum(budget, val);
    if (bv > total * 0.25) out.push({ type:'warn', tag:'Data quality', text:`<b>${eur(bv)}</b> (${fmtPct(bv/total)}) of the quoted value sits in <b>${budget.length} budgetary / indicative quotes</b>. Use the “Exclude budgetary quotes” toggle to see the bankable pipeline.` });
    const wr = winRate(rows); if (wr !== null) out.push({ type: wr >= 0.6 ? 'opp' : 'risk', tag:'Win rate', text:`Decided bids are won <b>${fmtPct(wr)}</b> of the time (${st['PO Received'].count} won vs ${st['Bid Lost'].count} lost). Lost value: <b>${eur(st['Bid Lost'].value)}</b>${st['Bid Lost'].value > st['PO Received'].value ? ' — more value has been lost than won.' : '.'}` });
    const open = rows.filter(r=>r.status==='Open Quote'), overdue = open.filter(r => daysUntil(r.close) < 0);
    if (overdue.length) out.push({ type:'risk', tag:'Open quotes', text:`<b>${overdue.length} of ${open.length} open quotes</b> are past their closing date (${eur(sum(overdue,val))}). Median age ${median(overdue.map(r=>daysSince(r.rfq)))} days — these need a status decision (won / lost / declined) to keep the pipeline honest.` });
    const pipe = rows.filter(r=>r.status==='Under Pipeline'), awaiting = pipe.filter(r=>/awaiting po/i.test(r.stage));
    if (awaiting.length) out.push({ type:'opp', tag:'Under pipeline', text:`<b>${awaiting.length} quotes worth ${eur(sum(awaiting,val))}</b> are at “Awaiting PO” — the closest money to the bank. Oldest has been waiting ${Math.max(...awaiting.map(r=>daysSince(r.qtn||r.rfq)))} days.` });
    const byC = groupBy(rows, r=>r.country); const topC = Object.keys(byC).sort((a,b)=>byC[b].length-byC[a].length)[0];
    if (topC && Object.keys(byC).length > 1) out.push({ type:'info', tag:'Concentration', text:`<b>${COUNTRY_NAME[topC]||topC}</b> generates ${fmtPct(byC[topC].length/rows.length)} of RFQs and ${fmtPct(sum(byC[topC],val)/Math.max(total,1))} of quoted value across ${uniq(byC[topC].map(r=>r.customer)).length} customers.` });
    const byCu = groupBy(rows, r=>r.customer); const topCu = Object.keys(byCu).sort((a,b)=>byCu[b].length-byCu[a].length)[0];
    if (topCu) { const g = byCu[topCu], w = winRate(g); out.push({ type:'info', tag:'Largest account', text:`<b>${esc(topCu)}</b>: ${g.length} RFQs, ${eur(sum(g,val))} quoted, ${g.filter(r=>r.status==='PO Received').length} POs${w!==null?`, win rate ${fmtPct(w)}`:''}.` }); }
    const d2po = rows.filter(r=>r.daysToPO!==null).map(r=>r.daysToPO); if (d2po.length) out.push({ type:'info', tag:'Cycle time', text:`RFQ → PO takes a median <b>${median(d2po)} days</b> (mean ${Math.round(mean(d2po))}). RFQ → closing date is typically ${median(rows.filter(r=>r.daysToClose!==null).map(r=>r.daysToClose))} days.` });
    const dec = rows.filter(r=>r.status==='RFQ Declined'); if (dec.length) { const g = groupBy(dec, r=>r.declinedGroup); const top = Object.keys(g).sort((a,b)=>g[b].length-g[a].length)[0]; out.push({ type:'warn', tag:'Declines', text:`<b>${dec.length} RFQs declined</b> (${fmtPct(dec.length/rows.length)} of intake). Leading cause: <b>${esc(top)}</b> (${g[top].length}). Declines for “insufficient details” or “no supplier quote” are recoverable with earlier clarification.` }); }
    const unpriced = rows.filter(r => r.value === null || r.value === 0); if (unpriced.length > rows.length * 0.15) out.push({ type:'warn', tag:'Data quality', text:`<b>${unpriced.length} RFQs</b> have no value recorded (blank, “--” or 0), so totals understate the true pipeline.` });
    return out;
  }

  /* =========================== 2. COUNTRIES =========================== */
  renderCountry(rows){
    const el = document.getElementById('page-country');
    const pool = this.filtered('country');                     // list ignores the country filter itself
    const byC = groupBy(pool, r=>r.country);
    const sel = this.f.country;
    const cards = [{ code:'', name:'All countries', rows: pool }, ...Object.keys(byC).sort((a,b)=>sum(byC[b],val)-sum(byC[a],val)).map(c => ({ code:c, name: COUNTRY_NAME[c] || c, rows: byC[c] }))];
    const maxV = Math.max(...cards.slice(1).map(c => sum(c.rows, val)), 1);
    const entity = c => { const v = sum(c.rows,val), po = c.rows.filter(r=>r.status==='PO Received'), w = winRate(c.rows); const st = this.statusStats(c.rows); return `
      <button class="entity" data-code="${esc(c.code)}" aria-pressed="${sel === c.code}">
        <div class="name"><span>${esc(c.code || 'All')}</span><small>${esc(c.code ? c.name : `${Object.keys(byC).length} countries`)}</small></div>
        <div class="big">${eur(v)}</div>
        <div class="row"><span><b>${c.rows.length}</b> RFQs</span><span><b>${po.length}</b> POs</span><span>win <b>${fmtPct(w)}</b></span></div>
        <div class="mini">${st.map(s=>`<i style="width:${v?(s.value/v*100):0}%;background:${SCOLOR[s.status]}"></i>`).join('')}</div>
      </button>`; };
    const name = sel ? (COUNTRY_NAME[sel] ? `${sel} · ${COUNTRY_NAME[sel]}` : sel) : 'All countries';
    const d2c = rows.filter(r=>r.daysToClose!==null).map(r=>r.daysToClose);
    const openR = rows.filter(r=>r.status==='Open Quote');
    el.innerHTML = `
      <div class="entity-grid" id="countryGrid">${cards.map(entity).join('')}</div>
      <div class="profile"><h3>${esc(name)}</h3><span class="pm"><b>${rows.length}</b> RFQs</span><span class="pm"><b>${uniq(rows.map(r=>r.customer)).length}</b> customers</span><span class="pm"><b>${eur(sum(rows,val))}</b> quoted</span><span class="pm">win rate <b>${fmtPct(winRate(rows))}</b></span><span class="pm">median RFQ → closing <b>${d2c.length?median(d2c)+' days':'—'}</b></span><span class="pm">open past closing date <b>${openR.filter(r=>daysUntil(r.close)<0).length}</b></span></div>
      ${this.heroHTML(rows)}
      <div class="grid g3">
        ${this.card('cc-monthly', 'Monthly intake', 'RFQ count by status with quoted value line','span2')}
        ${this.card('cc-status', 'Status mix', 'RFQ count share')}
      </div>
      <div class="grid g3">
        ${this.card(sel ? 'cc-cust' : 'cc-countries', sel ? 'Customers in this country' : 'Countries compared', sel ? 'Quoted value by customer, stacked by status' : 'Quoted value, stacked by status','span2')}
        ${this.card('cc-cycle', 'Turnaround', 'Days from RFQ received to closing date')}
      </div>
      <div class="card"><div class="card-head"><div><h3>Full RFQ data — ${esc(name)}</h3><p class="sub">Every line for the current filters · “Days to close” = closing date − RFQ received · “Due in” counts from today for open lines</p></div></div><div id="countryTable"></div></div>`;
    el.querySelectorAll('.entity').forEach(b => b.addEventListener('click', () => this.setFilter('country', b.dataset.code)));
    const months = this.monthly(rows);
    Chart.combo(document.getElementById('cc-monthly'), months.map(m => ({ key:m.key, label:m.label, values: STATUS.map(s => m.rows.filter(r=>r.status===s).length), line: sum(m.rows,val) })), { series: STATUS.map(s=>({name:s,color:SCOLOR[s]})), line:{name:'Quoted value'}, fmtLine: eur, labels:true, onClick: k => this.setFilter('month', k) });
    Chart.donut(document.getElementById('cc-status'), this.statusStats(rows).map(s=>({label:s.status,value:s.count,color:SCOLOR[s.status]})), { centerLabel:'RFQs', onClick: k => this.setFilter('status', k) });
